services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Supabase Postgres — the only database. `:?` makes compose refuse to start
      # rather than substituting an empty string, which would slip past the
      # os.environ[...] check in app/config.py and fail later inside SQLAlchemy.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required (Supabase connection string)}
      # Shared secret the frontend sends as X-API-Key. os.environ["API_KEY"] has no
      # default, so compose must forward it or the backend container crashes on boot.
      API_KEY: ${API_KEY:?API_KEY is required (shared secret with frontend)}
      # The models that write the content.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY is required (the content agents)}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Only the logo "from previous logo" edit path uses this (Gemini). Unset
      # just disables that path, so no `:?`.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      # Supabase Storage — required for every logo upload and generated image.
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-ad-angle-images}
      # WBT Command HQ's Client Data Export API — server-side only, never reaches
      # the browser. It is what fills the client switcher and prefills the forms.
      # Unset disables those routes, so it stays optional rather than `:?`.
      CLIENT_EXPORT_API_KEY: ${CLIENT_EXPORT_API_KEY}
      # These have working defaults in app/config.py. The bare `KEY:` form forwards
      # the host value only when set — writing ${VAR} would inject an empty string
      # when unset, and os.environ.get would return "" over the default.
      CLIENT_EXPORT_API_URL:
      FATHOM_TRANSCRIPT_WEBHOOK_URL:
      # Comma-separated origins allowed to call the API — the frontend's domain.
      # Empty falls back to localhost dev origins, so a real deployment must set it.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
    ports:
      - "${BACKEND_PORT:-9001}:8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Where the frontend finds the API. Inside the compose network that is the
      # service name, not localhost — the browser never calls the backend
      # directly, because every fetch happens in a server component.
      HUB_API_URL: ${HUB_API_URL:-http://backend:8000}
      # Must match API_KEY above. Read server-side at runtime, so it is a plain
      # environment variable rather than a build arg — it never reaches the
      # browser, and rotating it is a restart, not a rebuild.
      HUB_API_KEY: ${API_KEY:?API_KEY is required (frontend sends it as X-API-Key)}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4000}:3000"
